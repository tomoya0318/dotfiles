# herdr が初回起動時に書き込むフラグ。apply で消えないようソースにも保持
onboarding = false
# herdr 設定 (chezmoi 管理: dot_config/herdr/config.toml)
# デフォルト一覧: herdr --default-config / 反映: herdr server reload-config

[terminal]
# 新規ペイン/タブ/ワークスペースは元ペインの cwd を継承（tmux の pane_current_path 相当）
new_cwd = "follow"

[keys]
# tmux 時代の prefix (Ctrl-a) を踏襲
prefix = "ctrl+a"

# ビルトインのキーバインド一覧は F1 へ退避（prefix+? は日本語チートシートに使う）
help = "f1"

# Space 移動は prefix+w に集約し、prefix+g は Git/worktree メニューに使う
goto = ""

# worktree 操作は Git/worktree メニューに集約する
new_worktree = ""

# ペイン分割は tmux 慣習に合わせる（左右分割は | / デフォルトの prefix+v は無効化）
split_vertical = "prefix+|"

# vim 風 + 矢印キーでのペイン移動（hjkl はそのまま残す）
focus_pane_left = ["prefix+h", "prefix+left"]
focus_pane_down = ["prefix+j", "prefix+down"]
focus_pane_up = ["prefix+k", "prefix+up"]
focus_pane_right = ["prefix+l", "prefix+right"]

# send-prefix はビルトイン: prefix を2回押す（Ctrl-a Ctrl-a）と literal な
# Ctrl-a が中のアプリへ送られる（シェルの行頭移動）。設定不要。

# --- 日本語チートシート（Gum pager、popup で表示） ---
[[keys.command]]
key = "prefix+?"
type = "popup"
command = "~/.local/bin/herdr-cheatsheet"
description = "日本語チートシートを表示"

# --- Git/worktree メニュー（2キー目: g/n/o/d） ---
[[keys.command]]
key = "prefix+g"
type = "popup"
command = "~/.local/bin/herdr-git-menu"
description = "Git/worktree メニューを開く"

[theme]
name = "catppuccin"
auto_switch = false

[ui]
# 選択中ペイン・一時ペインを含む枠線はCatppuccin Blueで統一
accent = "#89b4fa"
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = false

# 背景ワークスペースの agent 状態変化を macOS 通知センターへ出す
# （アクティブタブは herdr の仕様で抑制される。フォーカス中の通知は hook 側で対応予定）
[ui.toast]
delivery = "system"
