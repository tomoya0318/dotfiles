# herdr が初回起動時に書き込むフラグ。apply で消えないようソースにも保持
onboarding = false
# herdr 設定 (chezmoi 管理: dot_config/herdr/config.toml)
# デフォルト一覧: herdr --default-config / 反映: herdr server reload-config

[terminal]
# 新規ペイン/タブ/ワークスペースは元ペインの cwd を継承（tmux の pane_current_path 相当）
new_cwd = "follow"

[keys]
# prefix は日常操作から外れたので、奪われて困らないキーにする。
# ctrl+a はシェル・Claude Code・codex の行頭移動として使うため返した。
prefix = "ctrl+q"

# navigate モードは cmd+g から直接開く。Space の移動はここに集約し、
# workspace_picker には cmd を割り当てない（prefix+w は残る）。
goto = "alt+g"

# --- cmd 系の direct binding ---
# Ghostty が cmd+X を ESC+文字 に変換して送ってくる（dot_config/ghostty/config を参照）。
# alt+文字 は物理キーでもあるため、割り当てた文字は内側のアプリから失われる。
# 奪うもの: d(kill-word) t(transpose-words) g(get-line) h(run-help) l(down-case-word)
#           n/p(history-search) w(copy-region-as-kill)。e は zsh 未割り当て。
#           fzf の alt+c は避けている。
# ペイン分割・ペイン移動は cmd 系のみ（prefix 版は使わないので割り当てない）
split_vertical = "alt+d"
split_horizontal = "alt+shift+d"
focus_pane_left = "alt+h"
focus_pane_down = "alt+j"
focus_pane_up = "alt+k"
focus_pane_right = "alt+l"

next_agent = "alt+n"
previous_agent = "alt+p"
new_workspace = "alt+shift+n"
close_pane = "alt+w"
new_tab = "alt+t"
switch_tab = "alt+1..9"

# send-prefix はビルトイン: prefix を2回押す（Ctrl-q Ctrl-q）と literal な
# Ctrl-q が中のアプリへ送られる。設定不要。

# cmd+e: 現在のペインの cwd を VS Code で開く。
# -r (--reuse-window) は既存ウィンドウの中身を差し替えてしまうため使わない。
[[keys.command]]
key = "alt+e"
type = "shell"
command = 'code "${HERDR_ACTIVE_PANE_CWD:-$PWD}"'
description = "cwd を VS Code で開く"

[theme]
name = "catppuccin"
auto_switch = false

[ui]
# 選択中ペインの枠線はCatppuccin Blueで統一
accent = "#89b4fa"
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = false

# renamer が生成した作業概要をAgentの3行目に表示
[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"], ["agent"], ["$task"]]

# 背景ワークスペースの agent 状態変化を macOS 通知センターへ出す
# （アクティブタブは herdr の仕様で抑制される。フォーカス中の通知は hook 側で対応予定）
[ui.toast]
delivery = "system"
